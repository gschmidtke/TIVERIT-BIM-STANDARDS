name: Validate TIVERIT BIM Standards

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - 'build/**'
      - 'migration/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install jsonschema referencing

      - name: Validate schemas and JSON objects
        run: python scripts/validate_repository.py
