name: Validate TIVERIT BIM Standards

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - 'build/**'
      - 'migration/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install jsonschema referencing

      - name: Validate schemas and JSON objects
        run: python scripts/validate_repository.py

      - name: Validate ATS governing links
        run: python scripts/validate_ats_governing_links.py

      - name: Validate conformance coverage inventory
        run: python scripts/generate_conformance_coverage.py --check

      - name: Run executable conformance fixtures
        run: python scripts/run_conformance_fixtures.py

      - name: Render human-readable standards
        run: python scripts/render_standards.py
