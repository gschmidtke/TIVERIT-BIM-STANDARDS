name: Canonical TIVERIT BIM Standards validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-curator-canonical-change:
    name: canonical-validation
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.user.login == 'gschmidtke'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted canonical change
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install jsonschema referencing

      - name: Validate schemas and JSON objects
        run: python scripts/validate_repository.py

      - name: Run executable conformance fixtures
        run: python scripts/run_conformance_fixtures.py

      - name: Render human-readable standards
        run: python scripts/render_standards.py
